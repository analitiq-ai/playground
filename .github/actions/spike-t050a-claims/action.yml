name: spike-t050a-claims
description: Print selected claims of this job's OIDC token (never the token itself).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
        echo "::add-mask::$token"
        TOKEN="$token" python3 -c '
        import base64, json, os
        payload = os.environ["TOKEN"].split(".")[1]
        claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
        for key in ("sub", "job_workflow_ref", "workflow_ref", "environment", "ref", "event_name"):
            print(f"{key}={claims.get(key)}")
        '
