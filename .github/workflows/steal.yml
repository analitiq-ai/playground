name: Steal key

# Simulates a collaborator's branch workflow trying to read the App key. Every run must be refused by the
# environment's branch policy before the step runs.
on: [push, pull_request, workflow_dispatch]

permissions: {}

jobs:
  steal:
    runs-on: ubuntu-latest
    environment:
      name: pr-gate
      deployment: false
    steps:
      - env:
          KEY: ${{ secrets.PR_GATE_APP_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "::error::KEY READABLE from $GITHUB_EVENT_NAME on $GITHUB_REF"; exit 1; fi
          echo "key empty on $GITHUB_EVENT_NAME $GITHUB_REF"
