name: Gate (reusable)

# The key is read from the calling repo's `pr-gate` environment, never passed in by the caller.
on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
      attested:
        required: true
        type: boolean

permissions: {}

jobs:
  evaluate:
    runs-on: ubuntu-latest
    environment: pr-gate
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PR_GATE_CLIENT_ID }}
          private-key: ${{ secrets.PR_GATE_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
      - name: Post internal-review
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD: ${{ inputs.head_sha }}
          ATTESTED: ${{ inputs.attested }}
        run: |
          if [ "$ATTESTED" = true ]; then
            state=(-f status=completed -f conclusion=success -f 'output[title]=attested')
          else
            state=(-f status=in_progress -f 'output[title]=waiting for the attested label')
          fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name=internal-review -f head_sha="$HEAD" "${state[@]}" \
            -f 'output[summary]=playground gate' --jq '{id, app: .app.slug, status, conclusion}'
